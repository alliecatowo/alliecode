name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify buildable
        run: go build ./cmd/ac

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  cross-build-smoke:
    name: Cross Build Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o ./bin/ac-linux-amd64 ./cmd/ac

      - name: Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/ac-linux-arm64 ./cmd/ac

      - name: Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o ./bin/ac-windows-amd64.exe ./cmd/ac
